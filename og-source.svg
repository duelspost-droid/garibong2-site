<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap');.brand{font-family:'Jua',sans-serif;}.body{font-family:'Noto Sans KR',sans-serif;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#0d2461"/></linearGradient>
    <linearGradient id="buildGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <clipPath id="cc"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#0d2461"/>
  <rect x="0" y="620" width="1200" height="10" fill="#0d2461"/>

  <!-- 심볼 (원형 엠블럼) : 좌측, 300x300 -->
  <svg x="150" y="165" width="300" height="300" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="56" fill="url(#skyGrad)"/>
    <ellipse cx="60" cy="78" rx="44" ry="10" fill="#2563eb" opacity="0.5" clip-path="url(#cc)"/>
    <path d="M38 78 A22 22 0 0 1 82 78" fill="url(#sunGrad)" clip-path="url(#cc)"/>
    <g stroke="#fcd34d" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="60" y1="48" x2="60" y2="42"/><line x1="72" y1="51.7" x2="75.2" y2="46.4"/><line x1="47.8" y1="51.7" x2="44.8" y2="46.4"/><line x1="79" y1="63" x2="84.5" y2="61"/><line x1="41" y1="63" x2="35.5" y2="61"/>
    </g>
    <rect x="51" y="38" width="18" height="40" rx="2" fill="url(#buildGrad)" clip-path="url(#cc)"/>
    <g fill="#bfdbfe" opacity="0.7"><rect x="54" y="42" width="4" height="3" rx="0.5"/><rect x="62" y="42" width="4" height="3" rx="0.5"/><rect x="54" y="48" width="4" height="3" rx="0.5"/><rect x="62" y="48" width="4" height="3" rx="0.5"/><rect x="54" y="54" width="4" height="3" rx="0.5"/><rect x="62" y="54" width="4" height="3" rx="0.5"/><rect x="54" y="60" width="4" height="3" rx="0.5"/><rect x="62" y="60" width="4" height="3" rx="0.5"/></g>
    <polygon points="60,30 67,38 53,38" fill="#93c5fd"/>
    <rect x="36" y="50" width="13" height="28" rx="1.5" fill="white" opacity="0.75" clip-path="url(#cc)"/>
    <g fill="#bfdbfe" opacity="0.6"><rect x="38.5" y="53" width="3" height="2.5" rx="0.4"/><rect x="43.5" y="53" width="3" height="2.5" rx="0.4"/><rect x="38.5" y="58" width="3" height="2.5" rx="0.4"/><rect x="43.5" y="58" width="3" height="2.5" rx="0.4"/><rect x="38.5" y="63" width="3" height="2.5" rx="0.4"/><rect x="43.5" y="63" width="3" height="2.5" rx="0.4"/></g>
    <rect x="71" y="53" width="13" height="25" rx="1.5" fill="white" opacity="0.75" clip-path="url(#cc)"/>
    <g fill="#bfdbfe" opacity="0.6"><rect x="73.5" y="56" width="3" height="2.5" rx="0.4"/><rect x="78.5" y="56" width="3" height="2.5" rx="0.4"/><rect x="73.5" y="61" width="3" height="2.5" rx="0.4"/><rect x="78.5" y="61" width="3" height="2.5" rx="0.4"/><rect x="73.5" y="66" width="3" height="2.5" rx="0.4"/><rect x="78.5" y="66" width="3" height="2.5" rx="0.4"/></g>
    <rect x="4" y="78" width="112" height="3" fill="#1e3a6e" clip-path="url(#cc)"/>
    <circle cx="60" cy="60" r="56" stroke="#2563eb" stroke-width="3" fill="none"/>

  <!-- 레터링 -->
  <text class="brand" x="500" y="285" font-size="98" fill="#0d2461">가리봉2구역</text>
  <text class="brand" x="503" y="360" font-size="52" fill="#1a2a6c">재개발정비사업조합</text>
  <line x1="503" y1="392" x2="1050" y2="392" stroke="#c9d0de" stroke-width="2"/>
  <text class="body" x="503" y="442" font-size="32" font-weight="500" fill="#475569">새벽이 밝아오는 가리봉, 함께 만드는 내일</text>
  <text class="brand" x="503" y="492" font-size="30" fill="#2563eb">garibong2.co.kr</text>
</svg>
